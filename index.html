          "name": "¿Qué incluye una landing page de FLANOVAX?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Incluye diseño personalizado, copy orientado a conversión, formulario de captación conectado a tu email y WhatsApp, diseño responsive, velocidad optimizada y acceso para editar el contenido. Todo listo para captar clientes desde el primer día."

          }

          "@type": "Question",
          "name": "¿Puedo editar el contenido de mi web después?",

            "@type": "Answer",
            "text": "Sí. Te entregamos la web con acceso y te explicamos cómo cambiar textos, imágenes y precios de forma sencilla. También puedes pedirnos soporte cuando necesites una actualización."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito tener dominio o hosting antes de empezar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No es obligatorio. Podemos asesorarte en la elección de dominio y hosting, o trabajar con los que ya tengas. Lo gestionamos todo o solo lo que necesites."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo llegan las solicitudes del formulario?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Directamente a tu email y, si lo prefieres, también a tu WhatsApp. Cada vez que alguien completa el formulario, recibes una notificación inmediata con todos los datos del contacto."
          }
        },
        {
          "@type": "Question",
          "name": "¿Hacéis el diseño desde cero o necesito darte materiales?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Podemos partir desde cero si no tienes logo ni identidad visual definida, o adaptar tu diseño actual si ya tienes materiales. El diagnóstico gratuito nos ayuda a definir el mejor punto de partida."
          }
